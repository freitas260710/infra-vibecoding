[project]
name = "infra-vibecoding"
version = "0.4.3"
description = "Infra Vibecoding: motor de segurança obrigatório para sistemas Django"
readme = "README.md"
authors = [{ name = "Ed Freitas", email = "331106550+freitas260710@users.noreply.github.com" }]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "defusedxml>=0.7.1",
    "django>=5.2,<5.3",
    "django-debug-toolbar>=8.0.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "sentry-sdk>=2.70.0",
]

[project.scripts]
infra-vibecoding = "infra_vibecoding.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
