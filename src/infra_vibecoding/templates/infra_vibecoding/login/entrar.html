{% extends "infra_vibecoding/login/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
  <p><a href="{% url 'esqueci_a_senha' %}">Esqueci a senha</a></p>
  <p><a href="{% url 'primeiro_acesso' %}">Primeiro acesso</a></p>
  {% if cadastro_publico %}<p><a href="{% url 'criar_conta' %}">Criar conta</a></p>{% endif %}
{% endblock %}
